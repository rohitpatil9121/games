<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PAPER PLANES</title>
<meta name="description" content="PAPER PLANES: fold a plane, ride the air of a giant room, and tag the one covered in ink. A browser game on the Projection Lab engine.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view" tabindex="0" aria-label="The game view"></canvas>
<div id="aim" aria-hidden="true"></div>
<div id="ring" role="status"></div>
<div id="tip" role="note" aria-live="polite" hidden></div>
<div id="caption" aria-live="assertive"></div>
<div id="flap" aria-label="Flap charge"><i></i></div>
<div id="result" role="status" hidden></div>
<pre id="debug" hidden></pre>
<p id="help">Click to fly with the mouse. Space or click: flap. W S A D also steer. 1 2 3: fold. N: next set. F3: numbers.</p>
<script type="module" src="game/main.js"></script>
</body>
</html>
